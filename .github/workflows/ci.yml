# Quality gate for every PR and every push to main (tickets F0-REPO-04, F0-REPO-08).
# Playwright E2E is added by F0-REPO-09.
# Branch protection on main must require the check named "Quality gate" (the job name below);
# renaming the job leaves a stale required check, so update the rule if you rename it.
#
# Coverage (F0-REPO-08): "Quality gate" runs unit tests with coverage, re-runs them on the PR's
# base commit, and fails if a touched apps/api/src/**/*.service.ts file lost coverage. It runs
# PR code with a read-only token. Only the two small jobs at the bottom get write access, and
# they execute no repository code: one posts the PR comment, one publishes the README badge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: 0 # git hooks are for local commits only
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: commitlint reads every PR commit; base checkout for coverage

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: PR title follows Conventional Commits (it becomes the squash-merge message)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Ticket tracker parses
        run: python3 scripts/status.py > /dev/null

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests with coverage
        run: pnpm test

      # Workspaces without a test:int script are skipped, so this is a no-op until one exists.
      # ubuntu-latest ships Docker, which Testcontainers uses for real Postgres.
      - name: Integration tests (Testcontainers)
        run: pnpm test:int

      - name: Merge coverage reports
        run: |
          pnpm exec hims-coverage merge --out coverage-report/head
          pnpm exec hims-coverage badge --summary coverage-report/head/coverage-summary.json --out coverage-report/coverage.json

      # The checkout is the PR merge commit, so HEAD^1 is exactly the base the PR is tested on.
      # If the base can't produce coverage (e.g. it predates `pnpm test`), the gate treats
      # touched service files as new and holds them to the new-file minimum instead.
      - name: Coverage of the PR base
        if: github.event_name == 'pull_request'
        run: |
          base_sha="$(git rev-parse HEAD^1)"
          git diff --name-only --diff-filter=AMR "$base_sha" HEAD > coverage-report/changed-files.txt
          git worktree add --detach "$RUNNER_TEMP/base" "$base_sha"
          if (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile && pnpm test); then
            pnpm exec hims-coverage merge --root "$RUNNER_TEMP/base" --as-root "$GITHUB_WORKSPACE" --out coverage-report/base
          else
            echo "::warning::Base commit $base_sha produced no coverage; touched service files are gated as new files."
          fi

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          if-no-files-found: ignore
          retention-days: 14
          path: |
            coverage-report/
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info

      - name: Coverage of touched apps/api service files did not drop
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec hims-coverage gate
          --head coverage-report/head/coverage-summary.json
          --base coverage-report/base/coverage-summary.json
          --changed coverage-report/changed-files.txt

  coverage-comment:
    name: Coverage comment
    needs: quality
    # Fork PRs get a read-only token and can't comment; their gate still runs in "Quality gate".
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download coverage
        id: download
        continue-on-error: true # quality failed before producing coverage: nothing to post
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Post coverage summary on the PR
        if: steps.download.outcome == 'success'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          name: Unit tests
          json-summary-path: coverage-report/head/coverage-summary.json
          json-final-path: coverage-report/head/coverage-final.json
          json-summary-compare-path: ${{ hashFiles('coverage-report/base/coverage-summary.json') != '' && 'coverage-report/base/coverage-summary.json' || '' }}
          file-coverage-mode: changes

  coverage-badge:
    name: Coverage badge
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # force-pushes the single-file coverage-badge branch, nothing else
    steps:
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # An orphan one-commit branch: no history growth, never merged, read by shields.io.
      - name: Publish badge to the coverage-badge branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir badge && cp coverage-report/coverage.json badge/ && cd badge
          git init -q -b coverage-badge
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore: coverage badge for ${GITHUB_SHA}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
              push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:coverage-badge
